name: Alfresco ROOT Web Application CI

on:
  pull_request:
    branches:
      - master
      - release/**
  push:
    branches:
      - master
      - release/**
  workflow_dispatch:

jobs:
  build_and_release:
    name: "Build and Release"
    uses: Alfresco/alfresco-build-tools/.github/workflows/build-and-release-maven.yml@v2.6.0
    secrets: inherit
    with:
      build-args: "-Dmaven.javadoc.skip=true"
      # master releases the current major (8.x), release/<major>.N branches release patches for older lines (e.g. 7.x)
      release-branches: '^(master|release/[0-9]+\.N)$'
